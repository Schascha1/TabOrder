name: Core tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python examples/quickstart.py
      - run: python examples/quickstart.py --checkpoint checkpoints/taborder-cc18-ctr23.pth
      - run: python -m taborder.train --steps 2 --batch-size 1 --min-seq-len 32 --max-seq-len 32 --device cpu --output runs/smoke.pth
      - run: python examples/quickstart.py --checkpoint runs/smoke.pth
